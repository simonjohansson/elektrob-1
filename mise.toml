[tools]
python = "3.12"
uv = "latest"
cmake = "latest"

[bootstrap.packages]
# Homebrew has Linux bottles too, so both get the same gcc
"brew:m68k-elf-gcc" = "latest"
"brew:m68k-elf-binutils" = "latest"
"apt:build-essential" = { os = "linux" }

[env]
_.path = ["/opt/homebrew/bin", "/home/linuxbrew/.linuxbrew/bin"]   # where mise's brew installs them
PYTHONPATH = "{{config_root}}/vendor/elekloader"
ELEKLOADER_STOCK = "{{config_root}}/firmware/Digitakt_OS1.53.syx"
ELEKLOADER_CROSS = "m68k-elf-"
DIGIEMU_HOME = "{{config_root}}/.digiemu"
FW_VERSION = "OB-1"                     # the OS version the unit shows: 4 characters

# `mise bootstrap` installs [bootstrap.packages] and [tools], then runs this
[tasks.bootstrap]
description = "Fetch submodules and the emulator's dependencies"
run = [
  "git submodule update --init",
  "cd vendor/digiemu && uv sync && tools/install-patched-unicorn.sh",
]

[tasks."build:deps"]
description = "Build the core and machine-pages mods the machine requires"
run = [
  "python -m elekloader.sdk.build vendor/elekloader/mods/core --out out",
  "python -m elekloader.sdk.build vendor/elekloader/mods/machine-pages --out out",
]

[tasks.build]
description = "Build the machine's .elemod"
depends = ["build:deps"]
run = "python -m elekloader.sdk.build machine --out out"

[tasks.test]
description = "Build the machine's DSP for the host and run its tests"
run = [
  "mkdir -p out",
  "cc -std=c99 -O2 -Wall -Wextra -Werror -Imachine machine/dsp.c machine/voice.c tests/test_dsp.c -lm -o out/test_dsp",
  "out/test_dsp",
]

[tasks.render]
description = "Render the machine's voice to a WAV (tools/render.c: note, seconds, the knobs, sweep)"
usage = '''
arg "<out>" help="The WAV to write"
arg "[settings]" var=#true help="key=value: note=57 seconds=4 wav1 wav2 frq2 mix1 mix2 mod nois, sweep=KNOB:FROM:TO"
'''
run = [
  "mkdir -p out",
  "cc -std=c99 -O2 -Wall -Wextra -Werror -Imachine machine/dsp.c machine/voice.c tools/render.c -lm -o out/render",
  "eval out/render \"$usage_out\" ${usage_settings:-}",
]

[tasks.analyze]
description = "Print f0, harmonic levels and the aliasing floor of a WAV"
usage = 'arg "<file>"'
run = "uv run -q --with numpy --with soundfile python tools/analyze.py ${usage_file}"

[tasks.knobs]
description = "Print the SRC page's knob graphics as text (machine/knobs.c)"
run = [
  "mkdir -p out",
  "cc -std=c99 -O2 -Wall -Wextra -Werror -Imachine machine/dsp.c machine/voice.c machine/knobs.c tools/knobs.c -o out/knobs",
  "out/knobs",
]

[tasks.protocol]
description = "Render the machine's side of #15's protocol (T1-T8) into out/ours"
run = [
  "mkdir -p out",
  "cc -std=c99 -O2 -Wall -Wextra -Werror -Imachine machine/dsp.c machine/voice.c tools/render.c -lm -o out/render",
  "uv run -q --with numpy --with soundfile python tools/protocol.py out/render out/ours",
]

[tasks.compare]
description = "Compare #15's captures in DIR with out/ours, test by test"
usage = 'arg "<dir>" help="The captures, named as in the protocol on issue 15"'
run = "uv run -q --with numpy --with soundfile python tools/compare.py ${usage_dir} out/ours"

[tasks.bench]
description = "Count the DSP's ColdFire instructions a block for 8 voices, in Unicorn"
run = [
  "mkdir -p out",
  "m68k-elf-gcc -mcpu=54455 -O2 -ffreestanding -fno-builtin -nostdlib -fomit-frame-pointer -Imachine -Wl,-Ttext=0x10000 -Wl,-e,bench machine/dsp.c machine/voice.c tools/bench.c -o out/bench.elf",
  "m68k-elf-objcopy -O binary out/bench.elf out/bench.bin",
  "uv run -q --with unicorn==2.1.4 --with capstone python tools/bench.py out/bench.bin out/bench.elf",
]

[tasks.firmware]
description = "Patch the stock OS with core, machine-pages and the OB-1 machine"
depends = ["build"]
run = "python -m elekloader.patch --stock $ELEKLOADER_STOCK --mod out/core-*.elemod --mod out/machine-pages-*.elemod --mod out/ob1-*.elemod --out out/Digitakt_custom.syx --version $FW_VERSION"

[tasks.emu]
description = "Add the custom firmware to digiemu and open its panel"
depends = ["firmware"]
dir = "vendor/digiemu"
run = '''
# digiemu names a build's folder dt1-<version, lower-cased, other characters as '-'>-<sha256[:8]>
v=$(printf %s "$FW_VERSION" | tr 'A-Z' 'a-z' | tr -c 'a-z0-9.' '-')
fw=$DIGIEMU_HOME/firmware/dt1-$v-$(shasum -a 256 {{config_root}}/out/Digitakt_custom.syx | cut -c1-8)
# it keeps each build (~530 MB) in its own folder: drop the older ones
for d in $DIGIEMU_HOME/firmware/dt1-$v-*; do [ "$d" = "$fw" ] || rm -rf "$d"; done
[ -d "$fw" ] || uv run python -m emu.portable --add {{config_root}}/out/Digitakt_custom.syx --yes
# what the launcher's Play button runs
uv run python -m emu.portable --worker panel "$fw"
'''

[tasks.release]
description = "Build the machine and release its .elemod on GitHub as ob1-v<version> (machine/mod.json's)"
depends = ["build", "test"]
run = '''
[ -z "$(git status --porcelain)" ] || { echo "release: commit first, so the release is the source it's tagged on"; exit 1; }
git fetch -q origin && [ -z "$(git log origin/main..HEAD)" ] || { echo "release: push first"; exit 1; }
v=$(python -c "import json; print(json.load(open('machine/mod.json'))['version'])")
gh release create "ob1-v$v" "out/ob1-$v.elemod" --target "$(git rev-parse HEAD)" --title "OB-1 $v" --generate-notes
'''
