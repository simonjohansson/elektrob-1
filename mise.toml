[tools]
python = "3.12"
uv = "latest"
cmake = "latest"

[bootstrap.packages]
# Homebrew has Linux bottles too, so both get the same gcc
"brew:m68k-elf-gcc" = "latest"
"brew:m68k-elf-binutils" = "latest"
"apt:build-essential" = { os = "linux" }

[env]
_.path = ["/opt/homebrew/bin", "/home/linuxbrew/.linuxbrew/bin"]   # where mise's brew installs them
PYTHONPATH = "{{config_root}}/vendor/elekloader"
ELEKLOADER_STOCK = "{{config_root}}/firmware/Digitakt_OS1.54.syx"   # your unit's OS: what firmware and emu build
ELEKLOADER_CROSS = "m68k-elf-"
DIGIEMU_HOME = "{{config_root}}/.digiemu"
FW_VERSION = "OB-1"                     # the OS version the unit shows: 4 characters

# `mise bootstrap` installs [bootstrap.packages] and [tools], then runs this
[tasks.bootstrap]
description = "Fetch submodules and the emulator's dependencies"
run = [
  "git submodule update --init",
  "cd vendor/digiemu && uv sync && tools/install-patched-unicorn.sh",
]

[tasks."build:deps"]
description = "Build dependencies for Digitakt and Digitone"
depends = ["build:deps:digitakt", "build:deps:digitone"]

# Each Digitakt stock file builds into out/os<OS>/, which holds only that OS's mods
[tasks."build:deps:digitakt"]
description = "Build the core and machine-pages mods the machine requires, for each OS in firmware/"
run = '''
rm -rf out/os*
for s in firmware/Digitakt_OS*.syx; do
  os=${s##*_OS}; mkdir -p out/os${os%.syx}
  python -m elekloader.sdk.build vendor/elekloader/mods/core --stock "$s" --out out/os${os%.syx} || exit 1
  python -m elekloader.sdk.build vendor/elekloader/mods/machine-pages --stock "$s" --out out/os${os%.syx} || exit 1
done
'''

[tasks.build]
description = "Build the Digitakt and Digitone mods"
depends = ["build:digitakt", "build:digitone"]

[tasks."build:digitakt"]
description = "Build the machine's .elemod, for each OS in firmware/"
depends = ["build:deps:digitakt"]
run = '''
for s in firmware/Digitakt_OS*.syx; do
  os=${s##*_OS}
  os=${os%.syx}
  python -m elekloader.sdk.build machines/digitakt --stock "$s" --out out/os$os || exit 1
  # the SDK suffixes only the ports' files: suffix the 1.53 ones too, so every file names its OS
  for f in out/os$os/*.elemod; do
    case $f in *-os$os.elemod) ;; *) mv "$f" "${f%.elemod}-os$os.elemod" ;; esac
  done
done
'''

[tasks.test]
description = "Build the machine's DSP for the host and run its tests"
run = [
  "mkdir -p out",
  "cc -std=c99 -O2 -Wall -Wextra -Werror -Idsp dsp/dsp.c dsp/voice.c tests/test_dsp.c -lm -o out/test_dsp",
  "out/test_dsp",
  "cc -std=c99 -O2 -Wall -Wextra -Werror -Idsp dsp/dsp.c dsp/voice.c tests/test_voice_headroom.c -lm -o out/test_voice_headroom",
  "out/test_voice_headroom",
  "cc -std=c99 -O2 -Wall -Wextra -Werror tests/test_digitakt_pitch.c -lm -o out/test_digitakt_pitch",
  "out/test_digitakt_pitch",
]

[tasks.render]
description = "Render the machine's voice to a WAV (tools/render.c: note, seconds, the knobs, sweep)"
usage = '''
arg "<out>" help="The WAV to write"
arg "[settings]" var=#true help="key=value: note=57 seconds=4 wav1 wav2 frq2 mix1 mix2 mod nois, sweep=KNOB:FROM:TO"
'''
run = [
  "mkdir -p out",
  "cc -std=c99 -O2 -Wall -Wextra -Werror -Idsp dsp/dsp.c dsp/voice.c tools/render.c -lm -o out/render",
  "eval out/render \"$usage_out\" ${usage_settings:-}",
]

[tasks.analyze]
description = "Print f0, harmonic levels and the aliasing floor of a WAV"
usage = 'arg "<file>"'
run = "uv run -q --with numpy --with soundfile python tools/analyze.py ${usage_file}"

[tasks.knobs]
description = "Print knob graphics for Digitakt and Digitone"
depends = ["knobs:digitakt", "knobs:digitone"]

[tasks."knobs:digitakt"]
description = "Print the SRC page's knob graphics as text (machines/digitakt/knobs.c)"
run = [
  "mkdir -p out",
  "cc -std=c99 -O2 -Wall -Wextra -Werror -Idsp -Imachines/digitakt dsp/dsp.c dsp/voice.c machines/digitakt/knobs.c tools/knobs.c -o out/knobs",
  "out/knobs",
]

[tasks.bench]
description = "Count the DSP's ColdFire instructions a block for 8 voices, in Unicorn"
run = [
  "mkdir -p out",
  "m68k-elf-gcc -mcpu=54455 -O2 -ffreestanding -fno-builtin -nostdlib -fomit-frame-pointer -Idsp -Wl,-Ttext=0x10000 -Wl,-e,bench dsp/dsp.c dsp/voice.c tools/bench.c -o out/bench.elf",
  "m68k-elf-objcopy -O binary out/bench.elf out/bench.bin",
  "uv run -q --with unicorn==2.1.4 --with capstone python tools/bench.py out/bench.bin out/bench.elf",
]

[tasks.firmware]
description = "Build firmware for Digitakt and Digitone"
depends = ["firmware:digitakt", "firmware:digitone"]

[tasks."firmware:digitakt"]
description = "Patch the stock OS ($ELEKLOADER_STOCK) with core, machine-pages and the OB-1 machine"
depends = ["build:digitakt"]
run = '''
os=${ELEKLOADER_STOCK##*_OS}
set -- out/os${os%.syx}/*.elemod
python -m elekloader.patch --stock $ELEKLOADER_STOCK $(printf -- '--mod %s ' "$@") --out out/Digitakt_custom.syx --version $FW_VERSION
'''

[tasks.emu]
description = "Open emulators for Digitakt and Digitone"
depends = ["emu:digitakt", "emu:digitone"]

[tasks."emu:digitakt"]
description = "Add the custom firmware to digiemu and open its panel"
depends = ["firmware:digitakt"]
dir = "vendor/digiemu"
run = '''
# digiemu names a build's folder dt1-<version, lower-cased, other characters as '-'>-<sha256[:8]>
v=$(printf %s "$FW_VERSION" | tr 'A-Z' 'a-z' | tr -c 'a-z0-9.' '-')
fw=$DIGIEMU_HOME/firmware/dt1-$v-$(shasum -a 256 {{config_root}}/out/Digitakt_custom.syx | cut -c1-8)
# it keeps each build (~530 MB) in its own folder: drop the older ones
for d in $DIGIEMU_HOME/firmware/dt1-$v-*; do [ "$d" = "$fw" ] || rm -rf "$d"; done
[ -d "$fw" ] || uv run python -m emu.portable --add {{config_root}}/out/Digitakt_custom.syx --yes
# what the launcher's Play button runs
uv run python -m emu.portable --worker panel "$fw"
'''

[tasks.release]
description = "Build, test and release the Digitakt and Digitone mods"
depends = ["release:digitakt", "release:digitone"]

[tasks."release:digitakt"]
description = "Build the machine and release its .elemod for each OS on GitHub as ob1-v<version> (machines/digitakt/mod.json's)"
depends = ["build:digitakt", "test"]
run = '''
[ -z "$(git status --porcelain)" ] || { echo "release: commit first, so the release is the source it's tagged on"; exit 1; }
git fetch -q origin && [ -z "$(git log origin/main..HEAD)" ] || { echo "release: push first"; exit 1; }
v=$(python -c "import json; print(json.load(open('machines/digitakt/mod.json'))['version'])")
gh release create "ob1-v$v" out/os*/ob1-$v*.elemod --target "$(git rev-parse HEAD)" --title "OB-1 $v" --generate-notes
'''

[tasks."build:digitone"]
description = "Placeholder for the Digitone mod build; produces no artifacts"
depends = ["build:deps:digitone"]
run = 'echo "Digitone support is not implemented; no artifacts produced"'

[tasks."build:deps:digitone"]
description = "Placeholder for Digitone dependencies; produces no artifacts"
run = 'echo "Digitone support is not implemented; no artifacts produced"'

[tasks."firmware:digitone"]
description = "Placeholder for the Digitone firmware build; produces no artifacts"
depends = ["build:digitone"]
run = 'echo "Digitone support is not implemented; no artifacts produced"'

[tasks."emu:digitone"]
description = "Placeholder for the Digitone emulator; opens no panel"
depends = ["firmware:digitone"]
run = 'echo "Digitone support is not implemented; no artifacts produced"'

[tasks."release:digitone"]
description = "Placeholder for the Digitone release; publishes nothing"
depends = ["build:digitone"]
run = 'echo "Digitone support is not implemented; no artifacts produced"'

[tasks."knobs:digitone"]
description = "Placeholder for Digitone knob graphics"
run = 'echo "Digitone support is not implemented; no artifacts produced"'
